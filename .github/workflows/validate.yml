name: Validate notebook

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run both sample videos and all analysis cells
        run: >-
          jupyter nbconvert --to notebook --execute optical_flow.ipynb
          --output executed --output-dir out
          --ExecutePreprocessor.timeout=600
